name: CI/CD Automated Validation Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Test Suite & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov torch numpy gymnasium stable-retro Pillow opencv-python-headless

      - name: Run Test Suite with Pytest
        run: |
          PYTHONPATH=. pytest -v tests/

      - name: Verify Code Structure & Importability
        run: |
          python -c "import telemetry.telemetry_overlay; import chat.challenge_evaluator; import scripts.watchdog; print('All core modules imported successfully.')"
